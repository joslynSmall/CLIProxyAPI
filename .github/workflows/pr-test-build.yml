name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh models catalog
        run: |
          models_ref="$(cat internal/registry/models/REF)"
          git fetch --depth 1 https://github.com/joslynSmall/models.git "$models_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$models_ref"
          git show FETCH_HEAD:models.json > internal/registry/models/models.json
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate embedded models catalog
        run: go test ./internal/registry -run TestEmbeddedCatalogSatisfiesSectionStateContract -count=1
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output
