[mongo]
enabled = true
# If the password contains reserved URI characters like / + @ : ?, percent-encode it first.
uri = mongodb://<RUNTIME_USER>:<URL_ENCODED_PASSWORD>@127.0.0.1:27017/<DATABASE>?authSource=<AUTH_DATABASE>&replicaSet=<REPLICA_SET>
database = <DATABASE>
snapshot_collection = service_state_snapshots
connect_timeout_seconds = 10
operation_timeout_seconds = 10
flush_interval_seconds = 30
